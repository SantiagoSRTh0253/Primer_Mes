Me gusta descubrir cosas nuevas de ti.

Hablo de esa sensación que me da estar contigo.

De esa tranquilidad que siento cuando hablamos.

De esa sonrisa que puede cambiarme el ánimo.

De esa forma que tienes de hacer que un momento cualquiera termine siendo un recuerdo que quiero guardar.

Entenderías por qué me emociono tanto contigo.

Entenderías por qué me cuesta explicar lo que siento.

No tienes que hacerlo.

Ya eres suficiente siendo tú.

A veces me pongo a pensar en todo lo que tuvo que pasar para que termináramos encontrándonos y me parece increíble.

Entre tantas personas, tantos días y tantos caminos diferentes, terminé conociéndote a ti.

Y sinceramente, no cambiaría eso.

Porque si todas las cosas que viví me llevaron hasta conocerte, entonces incluso los momentos difíciles terminaron dejando algo bueno en mi vida.

Tú.

Tampoco quiero decirte que todo será perfecto, porque sé que no será así.

Quiero algo mucho más sencillo.

Quiero que cuando las cosas se pongan difíciles, podamos seguir hablando.

Quiero que podamos entendernos.

Quiero que podamos aprender el uno del otro.

Quiero seguir conociéndote incluso después de mucho tiempo.

Quiero seguir teniendo conversaciones contigo que se alarguen más de lo que planeábamos.

Quiero seguir creando recuerdos contigo.

Eso es lo que realmente quiero.

No necesito una historia perfecta.

Quiero una historia nuestra.

Con días increíbles, días normales, días difíciles, risas, discusiones, abrazos, conversaciones largas, tonterías y todos esos pequeños momentos que terminan significando más de lo que uno esperaba.

No pienso solamente en una persona que amo.

Pienso en alguien que quiero tener cerca durante mucho tiempo.

Alguien que quiero cuidar.

Alguien a quien quiero ver feliz.

Alguien por quien quiero seguir mejorando.

Y seguir sintiendo exactamente las mismas ganas de quedarme.

Te amo, Tani.

Muchísimo.

Más de lo que sé explicar.

Más de lo que sé demostrar.

Te amo, mi Tani.

Mwwaaaa. ❤️

Con amor,
Tu guapo novio`;

function elegirCancion() {   // tecla C: elegir la canción desde el computador

  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) Snd.usar(URL.createObjectURL(f)); };

}
const Snd = (() => {
  let a = null, out, rev, mus, nbuf, drone = null, muted = false, ci = 0, el = null, ext = false, fadeT = null, estado = "";
  function init() {
    if (a) { if (a.state === "suspended") a.resume(); if (estado === "bloqueado") cargarMusica(); return; }
    const AC = typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    a = new AC(); out = a.createGain(); out.gain.value = 0.7; out.connect(a.destination);
    rev = a.createConvolver(); const n = a.sampleRate * 2, ib = a.createBuffer(2, n, a.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
    rev.buffer = ib; const rg = a.createGain(); rg.gain.value = 0.45; rev.connect(rg); rg.connect(out);
    nbuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const nd = nbuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    mus = a.createGain(); mus.gain.value = 0.0001; mus.connect(out); mus.connect(rev);
    mus.gain.linearRampToValueAtTime(1, a.currentTime + 3);
    pad(); setInterval(pad, 6000); setInterval(twinkle, 1700);
    cargarMusica();
  }
  function cargarMusica(i = 0) {   // prueba el archivo configurado y variantes comunes (m4a, ogg, wav, "musica.mp3.mp3")
    if (typeof Audio === "undefined" || !MUSICA_ARCHIVO) return;
    const lista = [MUSICA_ARCHIVO, "musica.mp3", "musica.m4a", "musica.ogg", "musica.wav", "musica.mp3.mp3"].filter((v, k, ar) => ar.indexOf(v) === k);
    if (i >= lista.length) { estado = "falta"; return; }
    const e = new Audio(lista[i]); e.loop = true; e.volume = 0; e.muted = muted;
    e.play().then(() => {
      el = e; ext = true; estado = "ok";
      mus.gain.cancelScheduledValues(a.currentTime); mus.gain.setTargetAtTime(0.0001, a.currentTime, 0.5); fade(0.55, 3);
    }).catch(err => { if (err && err.name === "NotAllowedError") estado = "bloqueado"; else cargarMusica(i + 1); });
  }
  function fade(v, sec) {
    if (!el) return; clearInterval(fadeT);
    const v0 = el.volume, n = Math.max(1, sec * 20); let i = 0;
    fadeT = setInterval(() => { i++; el.volume = Math.max(0, Math.min(1, v0 + (v - v0) * i / n)); if (i >= n) clearInterval(fadeT); }, 50);
  }
  function tone(f, d, type = "sine", v = 0.2, to = 0, t0 = 0, rv = 0, dest) {
    if (!a) return; const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.02, d / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || out);
    if (rv) { const s = a.createGain(); s.gain.value = rv; g.connect(s); s.connect(rev); }
    o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d, v, f = 1000, type = "lowpass", t0 = 0, q = 1, to = 0) {
    if (!a) return; const t = a.currentTime + t0, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain();
    s.buffer = nbuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, t);
    if (to) fl.frequency.exponentialRampToValueAtTime(to, t + d); fl.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.03, d / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + d + 0.05);
  }
  const CH = [[110, 165, 220, 261.6], [87.3, 130.8, 174.6, 220], [130.8, 196, 261.6, 329.6], [98, 146.8, 196, 247]]; // Am F C G
  function pad() {   // música ambiental: acordes suaves
    if (!a) return; const t = a.currentTime;
    CH[ci++ % 4].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain(); o.type = i ? "triangle" : "sine"; o.frequency.value = f; o.detune.value = (i - 1.5) * 4;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 2); g.gain.linearRampToValueAtTime(0.0001, t + 6.5);

  }
  function twinkle() {
    if (!a || Math.random() < 0.35) return;
    const sc = [440, 523.3, 587.3, 659.3, 784, 880, 1046.5];

    init, muted: () => muted, estado: () => estado,
    usar(url) {   // reproduce un archivo elegido a mano (tecla C)

    start() { arp([523, 784], 0.5, 0.1, 0.1, 0.5); },

    land() { noise(0.09, 0.12, 500); tone(130, 0.12, "sine", 0.22, 60); },
    step() { noise(0.05, 0.05, 700 + Math.random() * 500, "bandpass", 0, 2); },

    death() { tone(520, 0.9, "sawtooth", 0.12, 60); tone(260, 1.1, "sine", 0.2, 40, 0.05); noise(0.4, 0.08, 300); },
    ready() { tone(880, 0.3, "sine", 0.1, 0, 0, 0.6); tone(1320, 0.4, "sine", 0.08, 0, 0.12, 0.6); },
    revive() { arp([392, 523, 659, 784, 1047, 1319], 0.9, 0.1, 0.11, 0.8); noise(0.9, 0.05, 3000, "highpass"); },
    wing() { noise(0.3, 0.05, 1800, "bandpass", 0, 0.8, 500); },
    blip(k) { if (k === "a") tone(720 + Math.random() * 180, 0.07, "sine", 0.07, 0, 0, 0.3); else tone(140 + Math.random() * 50, 0.07, "triangle", 0.12); },
    transform() { tone(180, 0.9, "sawtooth", 0.06, 1800); noise(0.9, 0.08, 300, "bandpass", 0, 1, 4000); arp([523, 659, 784, 1047], 1.2, 0.1, 0.07, 0.8); },
    chime() { arp([523, 659, 784, 1047], 1.2, 0.1, 0.07, 0.8); },
    paper() { noise(0.3, 0.09, 3500, "bandpass", 0, 1.5); noise(0.2, 0.06, 2500, "bandpass", 0.12, 1.5); },
    sparkle() { tone(1500 + Math.random() * 1000, 0.25, "sine", 0.05, 0, 0, 0.7); },
    portalOpen() {
      if (!a) return; const t = a.currentTime; drone = { g: a.createGain(), os: [] };
      const fl = a.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.setValueAtTime(260, t); fl.frequency.linearRampToValueAtTime(900, t + 4);
      drone.g.gain.setValueAtTime(0.0001, t); drone.g.gain.linearRampToValueAtTime(0.11, t + 3);

    },

    portalStop() {

    },

  };
})();

  ctx.globalAlpha = 1; ctx.fillStyle = "#c9a9c0"; ctx.font = "16px Georgia, serif";

}
let letterY = 0, cartaL = null, cartaH = 0, letterDone = false, letterDrag = null;
function cartaLayout() {   // divide la carta en líneas (una sola vez)
  ctx.font = "19px Georgia, serif"; const L = [];
  for (const par of CARTA.split("\n")) {
    if (!par.trim()) { L.push(null); continue; }
    let line = "";
    for (const w of par.split(" ")) {
      const tt = line ? line + " " + w : w;
      if (ctx.measureText(tt).width > 500 && line) { L.push(line); line = w; } else line = tt;
    }
    L.push(line);
  }
  cartaL = L; cartaH = L.reduce((h, l) => h + (l === null ? 14 : 27), 0);
}
function carta() {
  if (!cartaL) cartaLayout();
  const a = Math.min(1, letterT / 60), oy = (1 - a) * 30, vx = 230, vy = 112, vw = 500, vh = 350;
  const max = Math.max(0, cartaH - vh + 24);
  if (letterT <= 1) letterY = 0;
  letterY = Math.max(0, Math.min(max, letterY)); letterDone = letterY >= max - 4;
  ctx.globalAlpha = a; ctx.fillStyle = "rgba(15,8,25,.7)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fbf1e2"; rr(190, 30 + oy, 580, 480, 8);
  ctx.fillStyle = "#c95f79"; ctx.fillRect(190, 30 + oy, 580, 8);
  ctx.fillStyle = "#4a2a3a"; ctx.font = "bold 28px Georgia, serif";
  ctx.textAlign = "center"; ctx.fillText(CARTA_TITULO, W / 2, 90 + oy);
  ctx.save(); ctx.beginPath(); ctx.rect(vx - 10, vy + oy, vw + 20, vh); ctx.clip();
  ctx.font = "19px Georgia, serif"; ctx.textAlign = "left"; ctx.fillStyle = "#4a2a3a";
  let y = vy + oy + 20 - letterY;
  for (const l of cartaL) {
    if (l === null) { y += 14; continue; }
    if (y > vy + oy - 30 && y < vy + oy + vh + 30) ctx.fillText(l, vx, y);
    y += 27;
  }
  ctx.restore();
  let g = ctx.createLinearGradient(0, vy + oy, 0, vy + oy + 22);   // bordes suaves arriba y abajo
  g.addColorStop(0, "#fbf1e2"); g.addColorStop(1, "rgba(251,241,226,0)"); ctx.fillStyle = g; ctx.fillRect(vx - 10, vy + oy, vw + 20, 22);
  g = ctx.createLinearGradient(0, vy + oy + vh - 22, 0, vy + oy + vh);
  g.addColorStop(0, "rgba(251,241,226,0)"); g.addColorStop(1, "#fbf1e2"); ctx.fillStyle = g; ctx.fillRect(vx - 10, vy + oy + vh - 22, vw + 20, 22);
  if (max > 0) {                                                   // barra de avance
    const th = Math.max(30, vh * vh / (cartaH + 24));
    ctx.fillStyle = "rgba(154,122,138,.25)"; ctx.fillRect(752, vy + oy, 4, vh);
    ctx.fillStyle = "rgba(201,95,121,.8)"; rr(752, vy + oy + (vh - th) * (letterY / max), 4, th, 2);

  }

}

function draw() {
